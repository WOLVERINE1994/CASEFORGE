name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://user:pass@localhost:5432/caseforge?sslmode=disable
      DIRECT_URL: postgresql://user:pass@localhost:5432/caseforge?sslmode=disable
      GROQ_API_KEY: dummy-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
